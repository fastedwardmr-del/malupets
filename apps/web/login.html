<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ingresar | Malupets</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body{margin:0;background:linear-gradient(135deg,#f3f9ff,#f8fbff);min-height:100vh}
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:22px}
    .login-card{width:min(440px,100%);background:#fff;border:1px solid #e5edf7;border-radius:28px;padding:30px;box-shadow:0 24px 65px rgba(15,23,42,.11)}
    .login-card .brand{font-size:29px;margin-bottom:28px}
    .login-card h1{font-size:28px;margin:0;color:#0f172a}
    .login-card .lead{margin:7px 0 24px;color:#64748b}
    .field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}
    .login-card .input{width:100%;box-sizing:border-box}
    .login-btn{width:100%;margin-top:6px}
    .error{display:none;background:#fff1f2;border:1px solid #fecdd3;color:#be123c;padding:11px;border-radius:12px;font-size:13px;margin:12px 0}.error.show{display:block}
    .security-note{margin-top:18px;padding-top:16px;border-top:1px solid #edf2f7;color:#94a3b8;font-size:11px;text-align:center}
  </style>
</head>
<body>
<main class="login-shell">
  <section class="login-card">
    <div class="brand"><span class="malu">Malu</span><span class="dog-dot">🐶</span><span class="pets">Pets</span></div>
    <h1>Bienvenido</h1>
    <p class="lead">Ingresa con tu usuario para acceder al sistema.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" class="input" type="email" autocomplete="username" placeholder="correo@empresa.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Contraseña" required>
      </div>

      <div id="errorBox" class="error"></div>
      <button id="loginButton" class="btn btn-blue login-btn" type="submit">Ingresar</button>
    </form>

    <div class="security-note">La sesión se mantiene protegida y expira automáticamente.</div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const errorBox = document.getElementById("errorBox");

if (Malu.getToken() && Malu.getStoredUser()) {
  window.location.replace("dashboard.html");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  errorBox.classList.remove("show");
  button.disabled = true;
  button.textContent = "Ingresando...";

  try {
    const res = await Malu.api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      })
    });

    if (!res?.ok) {
      errorBox.textContent = res?.error || "No fue posible ingresar";
      errorBox.classList.add("show");
      return;
    }

    Malu.setSession(res.token, res.user);

    const permissions = Array.isArray(res.user?.permissions) ? res.user.permissions : [];
    const isAdmin = permissions.includes("*");
    const destination = isAdmin || permissions.includes("dashboard") ? "dashboard.html"
      : permissions.includes("pos") ? "pos.html"
      : permissions.includes("agenda") ? "agenda.html"
      : "clientes.html";

    window.location.replace(destination);
  } catch (error) {
    console.error(error);
    errorBox.textContent = "No fue posible conectar con el servidor";
    errorBox.classList.add("show");
  } finally {
    button.disabled = false;
    button.textContent = "Ingresar";
  }
});
</script>
</body>
</html>
